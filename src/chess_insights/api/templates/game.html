{% extends "base.html" %}

{% block title %}ChessInsights Game{% endblock %}

{% block head_imports %}
{{ vite_asset('frontend/js/game.js') | safe }}
{% endblock %}

{% block content %}
<div class="game-container">
    <!-- Chessboard -->
    <div id="board"></div>
    <p id="statusEl">Make a move!</p>
</div>

<div class="bottom-buttons">

</div>
{% endblock %}
{% block rightbar %}
<!-- Controls Container-->
<div class="button-container">
    <div class="pgn-container"></div>
    <div class="button-group">

        <div class="action-buttons">
            <button class="btn-primary" onclick="undo()">Undo</button>
            <button class="btn-danger" onclick="startNewGame()">New Game</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    var currentFen = "{{ fen|default('start') }}";
    var currentPGN = "{{ pgn|default('') }}";
    var playerColor = "{{ color }}"
    var dests = {{ dests|tojson }}
</script>
{% endblock %}
