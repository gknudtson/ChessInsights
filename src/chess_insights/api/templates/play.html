{% extends "base.html" %}

{% block title %}ChessInsights{% endblock %}

{% block head_imports %}
    {{ vite_asset('frontend/js/play.js') | safe }}
{% endblock %}

{% block content %}
<body class="play">
<div class="game-container">
    <!-- Chessboard -->
    <div id="board"></div>
    <p id="statusEl">Pick your color</p>
</div>
</body>
<div class="bottom-buttons">

</div>
{% endblock %}
{% block rightbar %}
<!-- Controls Container-->
<div class="button-container">
    <div class="pgn-container"></div>
    <div class="button-group">

        <div class="action-buttons">
            <button class="btn-primary" id="white">White</button>
            <button class="btn-primary" id="random">Random</button>
            <button class="btn-primary" id="black">Black</button>
        </div>

        <div class="fen-input-container">
            <input type="text" id="userInput" placeholder="Enter Custom FEN">
            <button class="btn-primary" type="button" id="setFen">Set FEN</button>
        </div>
    </div>
</div>
{% endblock %}
